{% extends "memoiz/base.html" %}

{% block main-content %}
<div class="p-6 max-w-2xl mx-auto">
  <h1 class="text-3xl font-bold mb-4">Welcome to Memoiz</h1>
  
  <div class="card bg-white rounded-lg shadow-md p-6">
    <p class="text-gray-600 mb-4">
      Manage your notes and memos in one place.
    </p>
    
    <!-- Flash messages -->
    {% if messages %}
      <div class="space-y-2">
        {% for message in messages %}
          <div class="p-3 rounded {% if message.tags %}bg-{{ message.tags }}-100{% endif %} {% if message.tags %}text-{{ message.tags }}-800{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
