pre-commit:
  parallel: true
  jobs:
    - name: ruff-lint
      glob: '*.py'
      run: ruff check --fix {staged_files}
      stage_fixed: true

    - name: ruff-format
      glob: '*.py'
      run: ruff format {staged_files}
      stage_fixed: true

    - name: ty-typecheck
      glob: '*.py'
      run: ty check

    - name: oxlint
      glob: '*.{ts,tsx}'
      run: npx oxlint --fix {staged_files}
      stage_fixed: true

    - name: prettier
      glob: '*.{ts,tsx,json,css,md}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
